framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    php_errors:
        log: true
    csrf_protection: true
    trusted_hosts: null
    rate_limiter:
        login:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
        public_form:
            policy: 'sliding_window'
            limit: 20
            interval: '10 minutes'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
