security:
    password_hashers:
        App\Entity\AdminUser:
            algorithm: auto

    providers:
        admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            lazy: true
            pattern: ^/admin
            provider: admin_provider
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            custom_authenticators:
                - App\Security\AdminFormAuthenticator
            entry_point: App\Security\AdminFormAuthenticator
            logout:
                path: admin_logout
                target: admin_login

        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/admin/login,  roles: PUBLIC_ACCESS }
        - { path: ^/admin,        roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

when@test:
    security:
        password_hashers:
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
