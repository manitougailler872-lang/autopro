<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financement — AutoPro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['Oswald', 'ui-sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular']
        },
        colors: {
          ink: '#0B1220',
          inksoft: '#141B2E',
          paper: '#F6F5F2',
          hair: '#E3E0D8',
          rally: '#CE2A2E'
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; background: #F6F5F2; }

  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(420px 320px at 82% 20%, rgba(206,42,46,.35), transparent 60%),
      radial-gradient(300px 260px at 100% 100%, rgba(206,42,46,.18), transparent 65%);
  }
  .grid-lines {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(circle at 75% 35%, black, transparent 70%);
  }
</style>
</head>
<body>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-20">

  <!-- Eyebrow + headline, above the banner -->
  <div class="max-w-xl mb-8">
    <div class="flex items-center gap-2 mb-4">
      <span class="w-1.5 h-1.5 rounded-full bg-rally"></span>
      <span class="font-mono text-[11px] tracking-wide text-rally">Besoin ?</span>
    </div>
    <h2 class="font-display text-3xl sm:text-4xl font-semibold text-ink leading-[1.1] tracking-tight">
      Financez votre prochain véhicule
    </h2>
  </div>

  <!-- Dark banner with car photo -->
  <div class="relative bg-ink rounded-md overflow-hidden grid lg:grid-cols-[1.1fr_0.9fr] min-h-[300px]">
    <div class="grid-lines"></div>

    <!-- Left: pitch + CTA -->
    <div class="relative z-10 px-8 py-12 lg:px-14 lg:py-16 flex flex-col justify-center">
      <p class="text-white text-lg sm:text-xl font-medium leading-snug max-w-sm">
        Simulez votre financement gratuitement et recevez une réponse
        de nos partenaires bancaires en quelques clics.
      </p>

      <button type="button"
        class="mt-8 inline-flex items-center gap-2 bg-rally hover:bg-rally/90 transition-colors text-white font-semibold rounded px-6 py-3.5 text-sm w-fit">
        Simuler mon financement
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="flex flex-wrap gap-x-8 gap-y-3 mt-7">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-rally shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span class="text-sm text-slate-300">Réponse garantie</span>
        </div>
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-rally shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span class="text-sm text-slate-300">Sans engagement</span>
        </div>
      </div>
    </div>

    <!-- Right: real car photo, blended into the panel -->
    <div class="relative min-h-[260px] lg:min-h-0">
      <img src="https://images.unsplash.com/photo-1768396055034-fa546d0ace8a?fm=jpg&q=70&w=1400&auto=format&fit=crop"
           alt="Feu arrière de véhicule, ambiance nocturne"
           class="absolute inset-0 w-full h-full object-cover">
      <!-- blend the photo's left edge into the dark panel -->
      <div class="absolute inset-0" style="background: linear-gradient(90deg, #0B1220 0%, rgba(11,18,32,.55) 22%, rgba(11,18,32,0) 55%);"></div>
      <div class="absolute inset-0 lg:hidden" style="background: linear-gradient(180deg, rgba(11,18,32,.6) 0%, rgba(11,18,32,0) 35%);"></div>
      <div class="glow"></div>
    </div>

  </div>

</section>

</body>
</html>
